<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳細資訊 | 織心手作</title>
    <link rel="stylesheet" href="./styles.css">

    <style>
        .detail-gallery {
            width: 100%;
            max-width: 520px;
            min-width: 0;
        }

        .gallery-slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 14px;
            background: #f5eee6;
        }

        .gallery-track {
            display: flex;
            width: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .gallery-track::-webkit-scrollbar {
            display: none;
        }

        .gallery-slide {
            flex: 0 0 100%;
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            scroll-snap-align: start;
            background: #f5eee6;
        }

        .gallery-slide > img,
        .gallery-slide > video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #f5eee6;
        }

        /* Video không dùng controls mặc định của Safari */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5eee6;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* Nút phát video riêng */
        .video-play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 64px;
            height: 64px;
            border: none;
            border-radius: 50%;
            background: rgba(73, 58, 48, .8);
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-play-button.hidden {
            display: none;
        }

        .video-mute-button {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 4;
            border: none;
            border-radius: 20px;
            padding: 8px 12px;
            background: rgba(73, 58, 48, .8);
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .85);
            color: #493a30;
            font-size: 23px;
            cursor: pointer;
        }

        .gallery-prev {
            left: 10px;
        }

        .gallery-next {
            right: 10px;
        }

        .gallery-counter {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 5;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(0, 0, 0, .55);
            color: white;
            font-size: 13px;
        }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 14px 0;
        }

        .gallery-dot {
            width: 9px;
            height: 9px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #d8c9bb;
            cursor: pointer;
        }

        .gallery-dot.active {
            width: 22px;
            border-radius: 10px;
            background: #a87960;
        }

        .gallery-thumbnails {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0 12px;
        }

        .gallery-thumb {
            flex: 0 0 72px;
            width: 72px;
            height: 72px;
            padding: 2px;
            border: 2px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            background: #f5eee6;
            cursor: pointer;
        }

        .gallery-thumb.active {
            border-color: #a87960;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #80634e;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            .detail-gallery {
                max-width: 100%;
            }

            .gallery-arrow {
                width: 32px;
                height: 32px;
                font-size: 20px;
            }
        }
    </style>
</head>
<script src="./app.js"></script>
<body>

<header>
    <a href="./index.html" class="logo">
        <img src="./images/logo.png" alt="織心手作 Logo">
        <span>織心手作</span>
    </a>

    <nav>
        <a href="./index.html">首頁</a>
        <a href="./about.html">品牌介紹</a>
        <a href="./product.html">商品商城</a>
        <a href="./shop.html">購物說明</a>
        <a href="./contact.html">聯絡我們</a>
    </nav>

    <a href="./cart.html" class="cart-link">
        🛒 購物車 <span id="cart-count">0</span>
    </a>
</header>

<section class="detail-container">

    <div class="detail-gallery">

        <div class="gallery-slider">

            <div class="gallery-track" id="galleryTrack">
                <!-- 影片及圖片由 JavaScript 載入 -->
            </div>

            <button type="button"
                    class="gallery-arrow gallery-prev"
                    id="galleryPrev"
                    aria-label="上一張">‹</button>

            <button type="button"
                    class="gallery-arrow gallery-next"
                    id="galleryNext"
                    aria-label="下一張">›</button>

            <div class="gallery-counter" id="galleryCounter">1 / 1</div>

        </div>

        <div class="gallery-dots" id="galleryDots"></div>

        <div class="gallery-thumbnails" id="thumbnailList"></div>

    </div>

    <div class="detail-info">

        <p class="detail-label">織心手作・手工製作</p>

        <h1 id="productName">毛線手工藝品</h1>

        <p class="detail-price" id="productPrice">NT$ 350</p>

        <div class="detail-description">
            <h3>商品介紹</h3>
            <p id="productDescription">
                每件商品都是用心製作，溫暖又獨特。
                適合送禮，也適合自己收藏。
            </p>
        </div>

        <div class="detail-option">
            <label>選擇數量：</label>

            <div class="quantity-control">
                <button type="button" id="minusBtn">－</button>
                <span id="quantity">1</span>
                <button type="button" id="plusBtn">＋</button>
            </div>
        </div>

        <div class="detail-buttons">
            <button type="button" class="button add-cart" id="addCartBtn">
                🛒 加入購物車
            </button>

            <button type="button" class="button buy-now" id="buyNowBtn">
                立即購買
            </button>
        </div>

        <div class="product-notice">
            <p>✓ 手工製作，獨一無二</p>
            <p>✓ 用心包裝，適合送禮</p>
            <p>✓ 商品問題歡迎聯絡我們</p>
        </div>

    </div>

</section>

<footer>
    © 2026 織心手作｜用雙手編織溫暖
</footer>

<script src="./app.js"></script>
<script src="./product-detail.js"></script>

</body>
</html>
