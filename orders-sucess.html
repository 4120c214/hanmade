<!DOCTYPE html>
<html lang="zh-TW"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單成立成功 | 織心手作</title>

    <link rel="stylesheet" href="./styles.css">

    <style>
        body {
            background: #faf6ef;
            color: #493a30;
            font-family: Arial, "Noto Sans TC", sans-serif;
            margin: 0;
        }

        .success-container {
            max-width: 850px;
            margin: 60px auto;
            padding: 30px 20px;
        }

        .success-card {
            background: #fffdf9;
            border-radius: 20px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(73, 58, 48, 0.08);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            background: #82917a;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 25px;
        }

        .success-card h1 {
            font-size: 30px;
            color: #80634e;
            margin-bottom: 12px;
        }

        .success-message {
            color: #82917a;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .success-description {
            color: #88796c;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .order-number {
            background: #faf6ef;
            border: 1px dashed #dba6a1;
            padding: 18px;
            border-radius: 12px;
            margin: 25px 0;
        }

        .order-number p {
            margin: 5px;
            color: #80634e;
        }

        .order-number strong {
            font-size: 22px;
            color: #493a30;
        }

        .order-info {
            text-align: left;
            margin-top: 30px;
            border-top: 1px solid #eee5d9;
            padding-top: 20px;
        }

        .order-info h2 {
            font-size: 20px;
            color: #80634e;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee5d9;
            font-size: 15px;
        }

        .info-row span:first-child {
            color: #88796c;
        }

        .info-row span:last-child {
            text-align: right;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .product-list {
            margin-top: 20px;
        }

        .product-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee5d9;
        }

        .product-item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee5d9;
        }

        .product-detail {
            flex: 1;
        }

        .product-detail h3 {
            font-size: 15px;
            margin: 0 0 7px;
            color: #493a30;
        }

        .product-detail p {
            font-size: 13px;
            color: #88796c;
            margin: 0;
        }

        .product-price {
            font-weight: bold;
            color: #80634e;
            white-space: nowrap;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 2px solid #dba6a1;
            font-size: 18px;
            font-weight: bold;
        }

        .total-price {
            color: #b56f69;
            font-size: 24px;
        }

        .success-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 35px;
        }

        .success-buttons a {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn-home {
            background: #80634e;
            color: white;
        }

        .btn-orders {
            background: #dba6a1;
            color: white;
        }

        .success-buttons a:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .thank-you {
            margin-top: 30px;
            color: #82917a;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .success-container {
                margin: 25px auto;
                padding: 15px;
            }

            .success-card {
                padding: 30px 18px;
            }

            .success-card h1 {
                font-size: 24px;
            }

            .info-row {
                font-size: 14px;
            }

            .product-item img {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

<body>

<div class="success-container">
    <div class="success-card">

        <div class="success-icon">✓</div>

        <h1>訂單成立成功！</h1>

        <div class="success-message">
            感謝您的訂購 ♡
        </div>

        <p class="success-description">
            您的訂單已經成功建立！<br>
            感謝您支持織心手作，我們會用心準備您的商品。
        </p>

        <div class="order-number">
            <p>您的訂單編號</p>
            <strong id="orderNumber">載入中...</strong>
        </div>

        <div class="order-info">

            <h2>訂單資訊</h2>

            <div class="info-row">
                <span>訂單日期</span>
                <span id="orderDate">-</span>
            </div>

            <div class="info-row">
                <span>訂購姓名</span>
                <span id="customerName">-</span>
            </div>

            <div class="info-row">
                <span>聯絡電話</span>
                <span id="customerPhone">-</span>
            </div>

            <div class="info-row">
                <span>付款方式</span>
                <span id="paymentMethod">-</span>
            </div>
